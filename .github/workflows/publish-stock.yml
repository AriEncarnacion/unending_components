# Publishes Stock (public/r/*.json) to the registry after it lands on main.
#
# No stored key: the job gets a GitHub OIDC token, and the registry Worker
# accepts it only from this repository (by numeric id), refs/heads/main, a
# push event and this workflow file on main. Design systems never pass through
# here; Ship uploads them from Ari's Mac.
#
# Runs once the repository variable REGISTRY_URL is set (after the Worker is deployed).
name: Publish Stock

on:
  push:
    branches: [main]
    paths:
      - "public/r/*.json"
      - "scripts/publish-stock.mjs"
      - ".github/workflows/publish-stock.yml"
  # The first publish after deploying, or any time: Actions → Publish Stock → Run workflow (main only).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-stock
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Stock
    if: github.repository_id == 1467395964 && github.ref == 'refs/heads/main' && vars.REGISTRY_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Publish
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
        run: node scripts/publish-stock.mjs
